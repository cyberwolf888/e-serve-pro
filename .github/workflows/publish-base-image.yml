name: Publish Base Image

on:
  workflow_dispatch:

concurrency:
  group: publish-e-serve-pro-base-image
  cancel-in-progress: false

env:
  IMAGE_NAME: xyndr0me/e-serve-pro-base

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "value=$(tr -d '[:space:]' < .docker/baseimage/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Refuse existing version
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if docker manifest inspect "$IMAGE_NAME:$VERSION" >/dev/null 2>&1; then
            echo "Base image $IMAGE_NAME:$VERSION already exists. Bump .docker/baseimage/VERSION."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .docker/baseimage
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.value }}
            ${{ env.IMAGE_NAME }}:latest
