name: Deploy Application

on:
  workflow_dispatch:
  push:
    branches:
      - deploy

concurrency:
  group: application-deploy
  cancel-in-progress: true
env:
  CONTAINER_NAME: e-serve-pro
  CONTAINER_PORT: 8106

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.CONTAINER_NAME }}:latest .
      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.CONTAINER_NAME }}:latest

  deploy:
    needs: build-image
    runs-on: self-hosted
    steps:
      - name: Delete Old Container
        run: docker rm -f ${{ env.CONTAINER_NAME }}-container || true
      - name: Remove Old Image
        run: docker rmi -f ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.CONTAINER_NAME }}:latest || true
      - name: Pull New Docker Image
        run: docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.CONTAINER_NAME }}:latest
      - name: Create runtime env file
        run: echo '${{ vars.ENV_FILE }}' > $RUNNER_TEMP/${{ env.CONTAINER_NAME }}.env
      - name: Run New Container
        run: docker run -d --name ${{ env.CONTAINER_NAME }}-container --hostname ${{ env.CONTAINER_NAME }} --restart=unless-stopped -p ${{ env.CONTAINER_PORT }}:80 -v ${{ env.CONTAINER_NAME }}_storage:/app/storage -v $RUNNER_TEMP/${{ env.CONTAINER_NAME }}.env:/app/.env ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.CONTAINER_NAME }}:latest
