[PHP]
display_errors=On
max_execution_time=12000
max_input_time=12000
memory_limit=1024M
post_max_size=1024M
upload_max_filesize=1024M
max_file_uploads=100
allow_url_fopen=On

[Date]
date.timezone=Asia/Singapore

[opcache]
opcache.enable=1
opcache.enable_cli=1
opcache.jit_buffer_size=256M
opcache.jit=1235
